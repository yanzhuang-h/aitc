<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AITC 路口方案查询</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --panel: #ffffff;
      --border: #d7dfea;
      --text: #162033;
      --muted: #5f6b7a;
      --accent: #1f5eff;
      --accent-soft: #e8efff;
      --danger: #b42318;
      --success: #067647;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .shell {
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }
    .title {
      font-size: 22px;
      font-weight: 700;
      margin: 0;
    }
    .sub {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
    .grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 16px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      min-height: 260px;
    }
    .field { margin-bottom: 12px; }
    label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
      color: var(--muted);
    }
    input, textarea, button {
      width: 100%;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 14px;
      font-family: inherit;
    }
    input, textarea {
      background: #fff;
      padding: 10px 12px;
      color: var(--text);
    }
    textarea { min-height: 110px; resize: vertical; }
    button {
      border: 0;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      padding: 11px 12px;
      cursor: pointer;
    }
    button:disabled { opacity: .65; cursor: not-allowed; }
    .hint {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }
    .result {
      white-space: pre-wrap;
      word-break: break-word;
      background: #fafbfd;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      min-height: 420px;
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 13px;
      line-height: 1.6;
    }
    .meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      font-size: 12px;
      color: var(--muted);
    }
    .badge {
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
    }
    .status-ok { color: var(--success); }
    .status-error { color: var(--danger); }
    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div>
        <h1 class="title">AITC 路口方案查询</h1>
        <p class="sub">输入路口编号和需求，获取当前方案。</p>
      </div>
      <div class="badge">Signal Timing</div>
    </div>

    <div class="grid">
      <div class="panel">
        <div class="field">
          <label for="crossId">路口编号</label>
          <input id="crossId" value="1300068" placeholder="例如 1300068">
        </div>
        <div class="field">
          <label for="requestText">需求描述</label>
          <textarea id="requestText" placeholder="例如：请给出当前这个路口的放行方案。">请给出当前这个路口的放行方案。</textarea>
        </div>
        <div class="field">
          <button id="queryBtn">获取方案</button>
        </div>
        <div class="hint">
          当前页面先直接调用后端单路口方案接口。后续可以把这里替换成大模型解析，再自动选择 tool。
        </div>
      </div>

      <div class="panel">
        <div class="meta" id="metaLine">
          <span class="badge">待查询</span>
          <span>请求未发出</span>
        </div>
        <div class="result" id="resultBox">请在左侧输入路口编号并点击“获取方案”。</div>
      </div>
    </div>
  </div>

  <script>
    const crossId = document.getElementById('crossId');
    const requestText = document.getElementById('requestText');
    const queryBtn = document.getElementById('queryBtn');
    const resultBox = document.getElementById('resultBox');
    const metaLine = document.getElementById('metaLine');

    function renderMeta(status, message) {
      metaLine.innerHTML = '';
      const badge = document.createElement('span');
      badge.className = 'badge ' + (status === 'error' ? 'status-error' : 'status-ok');
      badge.textContent = status === 'error' ? '失败' : '完成';
      const text = document.createElement('span');
      text.textContent = message;
      metaLine.appendChild(badge);
      metaLine.appendChild(text);
    }

    queryBtn.addEventListener('click', async () => {
      const value = crossId.value.trim();
      const request = requestText.value.trim();
      if (!value) {
        renderMeta('error', '请输入路口编号');
        resultBox.textContent = 'cross_id 不能为空。';
        return;
      }
      queryBtn.disabled = true;
      renderMeta('ok', '正在请求方案');
      resultBox.textContent = '请求中...';
      try {
        const response = await fetch('/api/signal-timing', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ cross_id: value, request_text: request })
        });
        const payload = await response.json();
        if (!response.ok) {
          renderMeta('error', payload.error || '请求失败');
          resultBox.textContent = JSON.stringify(payload, null, 2);
          return;
        }
        renderMeta('ok', `路口 ${payload.cross_id} 已生成方案`);
        resultBox.textContent = JSON.stringify(payload, null, 2);
      } catch (error) {
        renderMeta('error', '网络请求失败');
        resultBox.textContent = String(error);
      } finally {
        queryBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
