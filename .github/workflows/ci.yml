name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      # 依赖清单由 requirements.txt 单一维护（本地 WSL .venv 与 CI 共用）
      - name: 安装依赖（requirements.txt）
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: 编译检查
        run: python -m compileall -q infra runtime agent app

      - name: 依赖一致性检查
        run: python -m pip check

      - name: 单元测试
        run: python -m unittest discover -s test -p "test_*.py"

      - name: 经验模块回归测试
        run: python -m unittest discover -s lib/data_ANS/tests -p "test_*.py"

      - name: 控制函数回归测试
        run: python -m unittest discover -s lib/control_functions/tests -p "test_*.py"

      - name: 全局处理器回归测试
        run: python -m unittest discover -s lib/control_functions/global_processors/tests -p "test_*.py"
