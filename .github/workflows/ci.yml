name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖（测试实际导入的第三方包）
        run: python -m pip install --upgrade pip numpy httpx python-dotenv pydantic uvicorn

      - name: 编译检查
        run: python -m compileall -q infra runtime agent app

      - name: 单元测试
        run: python -m unittest discover -s test -p "test_*.py"
