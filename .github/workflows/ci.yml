name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # mcp 固定在 1.x：agent/mcp_server.py 使用 mcp.server.fastmcp（2.x 已更名为 MCPServer），与本地 aitc 环境保持一致
      - name: 安装依赖（与本地 aitc 环境一致）
        run: python -m pip install --upgrade pip "mcp<2" apscheduler chinesecalendar numpy

      - name: 编译检查
        run: python -m compileall -q infra runtime agent app

      - name: 单元测试
        run: python -m unittest discover -s test -p "test_*.py"
